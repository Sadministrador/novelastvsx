<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SX Novelas — Player Sequencial</title>
<style>
  :root{
    --bg:#0b0b0d;
    --panel:#151517;
    --gold:#d4af37;
    --gold-dim:#8a7326;
    --text:#eee7d6;
    --text-dim:#8b8578;
    --danger:#7a2e2e;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow:hidden;
  }

  /* ---------- TELA DE CONFIGURAÇÃO ---------- */
  #setup{
    height:100vh;
    width:100vw;
    overflow-y:auto;
    padding:40px 24px 80px;
  }
  #setup h1{
    text-align:center;
    font-size:2rem;
    letter-spacing:4px;
    color:var(--gold);
    font-weight:400;
    margin-bottom:6px;
  }
  #setup .sub{
    text-align:center;
    color:var(--text-dim);
    font-family: Arial, sans-serif;
    font-size:0.85rem;
    letter-spacing:1px;
    margin-bottom:36px;
  }
  #grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap:14px;
    max-width:1100px;
    margin:0 auto 40px;
  }
  .slot{
    background:var(--panel);
    border:1px solid #2a2a2c;
    border-radius:6px;
    aspect-ratio: 3/4;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition:border-color .2s;
    overflow:hidden;
    text-align:center;
    padding:8px;
  }
  .slot:hover{ border-color:var(--gold-dim); }
  .slot.filled{ border-color:var(--gold); }
  .slot .num{
    font-family:Arial, sans-serif;
    font-size:0.7rem;
    letter-spacing:2px;
    color:var(--text-dim);
    position:absolute;
    top:8px;
    left:10px;
  }
  .slot .plus{
    font-size:2.2rem;
    color:var(--gold-dim);
    font-weight:300;
  }
  .slot .fname{
    font-family:Arial, sans-serif;
    font-size:0.7rem;
    color:var(--text);
    padding-top:8px;
    word-break:break-word;
    line-height:1.3;
  }
  .slot input{ display:none; }
  .slot .check{
    color:var(--gold);
    font-size:1.6rem;
  }

  #controlsBar{
    max-width:1100px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    font-family:Arial, sans-serif;
  }
  #countInfo{
    color:var(--text-dim);
    font-size:0.85rem;
    letter-spacing:1px;
  }
  #startBtn{
    background:transparent;
    border:1px solid var(--gold);
    color:var(--gold);
    padding:14px 46px;
    font-size:1rem;
    letter-spacing:3px;
    font-family:Arial, sans-serif;
    cursor:pointer;
    transition: all .2s;
  }
  #startBtn:hover:not(:disabled){
    background:var(--gold);
    color:#0b0b0d;
  }
  #startBtn:disabled{
    opacity:0.35;
    cursor:not-allowed;
  }
  .field{
    display:flex;
    align-items:center;
    gap:10px;
    color:var(--text-dim);
    font-size:0.85rem;
  }
  .field input[type=number]{
    width:70px;
    background:var(--panel);
    border:1px solid #2a2a2c;
    color:var(--text);
    padding:6px 8px;
    font-family:Arial, sans-serif;
    text-align:center;
  }

  /* ---------- PLAYER TELA CHEIA ---------- */
  #player{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:1000;
  }
  #video{
    width:100%;
    height:100%;
    object-fit:contain;
    background:#000;
  }
  #exitBtn{
    position:absolute;
    top:16px;
    right:20px;
    color:rgba(255,255,255,0.25);
    font-family:Arial, sans-serif;
    font-size:0.75rem;
    letter-spacing:1px;
    background:none;
    border:none;
    cursor:pointer;
    z-index:1200;
    padding:6px 10px;
  }
  #exitBtn:hover{ color:rgba(255,255,255,0.7); }

  /* ---------- TELA DE INTERVALO ---------- */
  #interval{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:1100;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  #interval .eyebrow{
    font-family:Arial, sans-serif;
    font-size:0.75rem;
    letter-spacing:5px;
    color:var(--gold-dim);
    margin-bottom:18px;
    text-transform:uppercase;
  }
  #interval h2{
    font-size:2.4rem;
    font-weight:400;
    color:var(--gold);
    letter-spacing:2px;
    margin-bottom:8px;
  }
  #interval .nextName{
    font-family:Arial, sans-serif;
    color:var(--text-dim);
    font-size:0.9rem;
    margin-bottom:46px;
    letter-spacing:1px;
  }
  #timer{
    font-size:4.5rem;
    color:var(--text);
    letter-spacing:6px;
    font-variant-numeric: tabular-nums;
    font-family: Georgia, serif;
  }
  #skipWait{
    margin-top:40px;
    background:none;
    border:1px solid #3a3a3c;
    color:var(--text-dim);
    padding:10px 28px;
    font-family:Arial, sans-serif;
    font-size:0.75rem;
    letter-spacing:2px;
    cursor:pointer;
  }
  #skipWait:hover{ border-color:var(--gold-dim); color:var(--gold); }

  @media (max-width:600px){
    #interval h2{ font-size:1.5rem; }
    #timer{ font-size:3rem; }
  }
</style>
</head>
<body>

<!-- TELA DE CONFIGURAÇÃO -->
<div id="setup">
  <h1>SX NOVELAS</h1>
  <div class="sub">CARREGUE OS 16 EPISÓDIOS PARA INICIAR A SESSÃO</div>

  <div id="grid"></div>

  <div id="controlsBar">
    <div class="field">
      INTERVALO ENTRE VÍDEOS
      <input type="number" id="gapMinutes" value="30" min="0" max="180">
      MINUTOS
    </div>
    <div id="countInfo">0 de 16 episódios carregados</div>
    <button id="startBtn" disabled>INICIAR SESSÃO</button>
  </div>
</div>

<!-- PLAYER -->
<div id="player">
  <video id="video" autoplay playsinline></video>
  <button id="exitBtn">SAIR ✕</button>
</div>

<!-- INTERVALO -->
<div id="interval">
  <div class="eyebrow">SX Novelas</div>
  <h2>Próxima novela daqui a 30 minutos</h2>
  <div class="nextName" id="nextName"></div>
  <div id="timer">30:00</div>
  <button id="skipWait">PULAR ESPERA</button>
</div>

<script>
const TOTAL_SLOTS = 16;
const files = new Array(TOTAL_SLOTS).fill(null);

const grid = document.getElementById('grid');
const startBtn = document.getElementById('startBtn');
const countInfo = document.getElementById('countInfo');
const gapMinutesInput = document.getElementById('gapMinutes');

// monta os 16 slots de upload
for(let i=0;i<TOTAL_SLOTS;i++){
  const slot = document.createElement('label');
  slot.className = 'slot';
  slot.innerHTML = `
    <span class="num">EP ${String(i+1).padStart(2,'0')}</span>
    <span class="plus">+</span>
    <span class="fname"></span>
    <input type="file" accept="video/*" data-index="${i}">
  `;
  const input = slot.querySelector('input');
  input.addEventListener('change', e=>{
    const f = e.target.files[0];
    if(!f) return;
    files[i] = f;
    slot.classList.add('filled');
    slot.querySelector('.plus').textContent = '✓';
    slot.querySelector('.plus').className = 'check';
    slot.querySelector('.fname').textContent = f.name;
    updateCount();
  });
  grid.appendChild(slot);
}

function updateCount(){
  const n = files.filter(Boolean).length;
  countInfo.textContent = `${n} de ${TOTAL_SLOTS} episódios carregados`;
  startBtn.disabled = n === 0;
}

// ---------- PLAYER ----------
const setupEl = document.getElementById('setup');
const playerEl = document.getElementById('player');
const intervalEl = document.getElementById('interval');
const videoEl = document.getElementById('video');
const timerEl = document.getElementById('timer');
const nextNameEl = document.getElementById('nextName');
const intervalTitle = intervalEl.querySelector('h2');
const exitBtn = document.getElementById('exitBtn');
const skipWaitBtn = document.getElementById('skipWait');

let queue = [];
let currentIndex = 0;
let gapSeconds = 1800;
let countdownTimer = null;

startBtn.addEventListener('click', async ()=>{
  queue = files.filter(Boolean);
  if(queue.length === 0) return;
  gapSeconds = (parseInt(gapMinutesInput.value,10) || 0) * 60;
  currentIndex = 0;
  setupEl.style.display = 'none';
  playerEl.style.display = 'block';
  try{ await playerEl.requestFullscreen?.(); }catch(e){}
  playCurrent();
});

function playCurrent(){
  intervalEl.style.display = 'none';
  playerEl.style.display = 'block';
  const file = queue[currentIndex];
  const url = URL.createObjectURL(file);
  videoEl.src = url;
  videoEl.controls = false;
  videoEl.muted = false;
  videoEl.play().catch(()=>{});
}

videoEl.addEventListener('ended', ()=>{
  // sai o vídeo atual da página
  URL.revokeObjectURL(videoEl.src);
  videoEl.removeAttribute('src');
  videoEl.load();
  playerEl.style.display = 'none';

  currentIndex = (currentIndex + 1) % queue.length;
  const nextFile = queue[currentIndex];
  nextNameEl.textContent = nextFile ? nextFile.name : '';

  startCountdown(gapSeconds);
});

function startCountdown(seconds){
  intervalEl.style.display = 'flex';
  let remaining = seconds;
  updateTimerDisplay(remaining);
  updateTitle(remaining);

  clearInterval(countdownTimer);
  countdownTimer = setInterval(()=>{
    remaining--;
    if(remaining <= 0){
      clearInterval(countdownTimer);
      playCurrent();
      return;
    }
    updateTimerDisplay(remaining);
    updateTitle(remaining);
  }, 1000);
}

function updateTitle(remaining){
  const mins = Math.ceil(remaining/60);
  intervalTitle.textContent = mins > 0
    ? `Próxima novela daqui a ${mins} minuto${mins>1?'s':''}`
    : `Próxima novela em instantes`;
}

function updateTimerDisplay(remaining){
  const m = String(Math.floor(remaining/60)).padStart(2,'0');
  const s = String(remaining%60).padStart(2,'0');
  timerEl.textContent = `${m}:${s}`;
}

skipWaitBtn.addEventListener('click', ()=>{
  clearInterval(countdownTimer);
  playCurrent();
});

exitBtn.addEventListener('click', ()=>{
  clearInterval(countdownTimer);
  videoEl.pause();
  if(document.fullscreenElement) document.exitFullscreen?.();
  playerEl.style.display = 'none';
  intervalEl.style.display = 'none';
  setupEl.style.display = 'block';
});
</script>

</body>
</html>
